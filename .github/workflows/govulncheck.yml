name: Govulncheck

on:
  pull_request:
    branches: [main]
    # Mirror scripts/ci_change_scope.py: skip Wall-, docs-, and website-only PRs.
    paths:
      - "**"
      - "!docs/**"
      - "docs/openapi/latest.json"
      - "docs/API_NOTES.md"
      - "docs/WORKFLOWS.md"
      - "!*.md"
      - "!*.mdx"
      - "!.mintignore"
      - "!docs.json"
      - "!.mintlify/**"
      - "!commands/**"
      - "!concepts/**"
      - "!configuration/**"
      - "!guides/**"
      - "!resources/**"
      - "!website/**"
      - "**.go"
  push:
    branches: [main]
  schedule:
    # Run weekly to catch newly disclosed vulnerabilities in existing dependencies.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          go-download-base-url: https://dl.google.com/go
          cache: true

      - name: Install govulncheck
        run: make install-govulncheck

      - name: Scan Go dependencies and reachable code paths
        run: govulncheck -format text ./...
