name: Main Branch (with integration tests)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      website_affected: ${{ steps.scope.outputs.website_affected }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$before"
            files="$(git diff --name-only --no-renames "$before" "$after")"
          else
            files="$(git diff-tree --no-commit-id --name-only --no-renames -r "$after")"
          fi

          force_full=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|scripts/ci_change_scope.py|scripts/test_ci_change_scope.py|scripts/test_ci_workflows.py)
                force_full=true
                ;;
            esac
          done <<< "$files"

          if [ "$force_full" = true ]; then
            selection="$(printf '%s\n' 'scope=full' 'website_affected=true')"
          else
            selection="$(printf '%s\n' "$files" | python3 scripts/ci_change_scope.py --github-output)"
          fi
          scope="$(printf '%s\n' "$selection" | sed -n 's/^scope=//p')"
          case "$scope" in
            wall|docs|website|telemetry|full) ;;
            *) echo "invalid CI scope: $scope" >&2; exit 1 ;;
          esac
          printf '%s\n' "$selection" >> "$GITHUB_OUTPUT"

  wall-only-check:
    needs: changes
    if: needs.changes.outputs.scope == 'wall'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: wall-only-check

      - name: Check Wall of Apps source
        run: make check-wall-of-apps

  website-checks:
    needs: changes
    if: needs.changes.outputs.website_affected == 'true'
    uses: ./.github/workflows/website-checks.yml

  quality-checks:
    needs: changes
    if: contains(fromJSON('["docs", "telemetry", "full"]'), needs.changes.outputs.scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: quality

      - name: Resolve Go tool versions
        id: go-tool-versions
        run: |
          versions="$(sed -n -E 's/^(GOFUMPT|GOLANGCI_LINT)_VERSION \?= (v[0-9][^ ]*)$/\2/p' Makefile | paste -sd- -)"
          case "$versions" in
            v*-v*) ;;
            *) echo "unable to read tool versions from Makefile" >&2; exit 1 ;;
          esac
          printf 'key=%s-%s\n' "$(go env GOVERSION)" "$versions" >> "$GITHUB_OUTPUT"

      - name: Cache Go tools
        id: go-tools-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-go-tools-${{ steps.go-tool-versions.outputs.key }}

      - name: Install tooling
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: make tools

      - name: Check formatting
        run: |
          go_tools_bin="$(go env GOPATH)/bin"
          export PATH="$go_tools_bin:$PATH"
          make format-check

      - name: Check Wall of Apps source
        if: contains(fromJSON('["docs", "full"]'), needs.changes.outputs.scope)
        run: make check-wall-of-apps

      - name: Self-test docs validators
        if: contains(fromJSON('["docs", "full"]'), needs.changes.outputs.scope)
        run: |
          python3 scripts/test_check_docs.py
          python3 scripts/test_check_docs_commands.py
          python3 scripts/test_generate_command_docs.py

      - name: Check CI workflow contracts
        if: needs.changes.outputs.scope == 'full'
        run: python3 scripts/test_ci_workflows.py

      - name: Test CI change selection
        if: needs.changes.outputs.scope == 'full'
        run: python3 scripts/test_ci_change_scope.py

      - name: Check documentation
        if: contains(fromJSON('["docs", "full"]'), needs.changes.outputs.scope)
        run: make check-docs

  lint:
    needs: changes
    if: contains(fromJSON('["telemetry", "full"]'), needs.changes.outputs.scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: lint

      - name: Resolve Go tool versions
        id: go-tool-versions
        run: |
          versions="$(sed -n -E 's/^(GOFUMPT|GOLANGCI_LINT)_VERSION \?= (v[0-9][^ ]*)$/\2/p' Makefile | paste -sd- -)"
          case "$versions" in
            v*-v*) ;;
            *) echo "unable to read tool versions from Makefile" >&2; exit 1 ;;
          esac
          printf 'key=%s-%s\n' "$(go env GOVERSION)" "$versions" >> "$GITHUB_OUTPUT"

      - name: Cache Go tools
        id: go-tools-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ runner.arch }}-go-tools-${{ steps.go-tool-versions.outputs.key }}

      - name: Install tooling
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: make tools

      - name: Cache lint analysis
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.golangci-cache
          key: golangci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', '.golangci.yml') }}-

      - name: Run lint
        run: |
          go_tools_bin="$(go env GOPATH)/bin"
          export PATH="$go_tools_bin:$PATH"
          make lint

  vet-platforms:
    needs: changes
    if: contains(fromJSON('["telemetry", "full"]'), needs.changes.outputs.scope)
    name: vet (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: vet-${{ matrix.goos }}

      # Every test job runs on ubuntu, so darwin- and windows-gated sources and
      # tests are otherwise never type-checked. golangci-lint already vets
      # GOOS=linux with tests enabled.
      - name: Vet platform-gated code
        run: GOOS=${{ matrix.goos }} go vet ./...

  format-and-lint:
    needs: [changes, wall-only-check, quality-checks, lint, vet-platforms, website-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected quality checks
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change detection result: ${{ needs.changes.result }}"
            exit 1
          fi

          case "${{ needs.changes.outputs.scope }}" in
            wall) required="${{ needs.wall-only-check.result }}" ;;
            docs) required="${{ needs.quality-checks.result }}" ;;
            telemetry|full)
              required="${{ needs.quality-checks.result }}"
              for result in "${{ needs.lint.result }}" "${{ needs.vet-platforms.result }}"; do
                if [ "$result" != "success" ]; then required="$result"; fi
              done
              ;;
            website) required="${{ needs.website-checks.result }}" ;;
            *) echo "unknown CI scope"; exit 1 ;;
          esac

          if [ "$required" != "success" ]; then
            echo "required quality result: $required"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.website_affected }}" = "true" ] && [ "${{ needs.website-checks.result }}" != "success" ]; then
            echo "website checks result: ${{ needs.website-checks.result }}"
            exit 1
          fi

  test-shards:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    name: test shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            command: go test -v ./cmd && python3 scripts/go_test_shard.py packages --packages ./... --exclude ./cmd --exclude ./internal/cli/cmdtest --exclude ./internal/cli/web --shard-index 0 --shard-total 1 -- -v
          - name: web 1/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/web --shard-index 0 --shard-total 2 -- -v
          - name: web 2/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/web --shard-index 1 --shard-total 2 -- -v
          - name: cmdtest 1/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/cmdtest --shard-index 0 --shard-total 2 -- -v
          - name: cmdtest 2/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/cmdtest --shard-index 1 --shard-total 2 -- -v
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: test-${{ matrix.name }}

      - name: Run Go test shard
        env:
          ASC_BYPASS_KEYCHAIN: "1"
        run: ${{ matrix.command }}

  telemetry-linux-tests:
    needs: changes
    if: needs.changes.outputs.scope == 'telemetry'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: telemetry-linux-tests

      - name: Run telemetry tests
        run: ASC_BYPASS_KEYCHAIN=1 go test -short ./internal/telemetry ./internal/cli/telemetry ./cmd

  telemetry-windows-tests:
    needs: changes
    if: contains(fromJSON('["telemetry", "full"]'), needs.changes.outputs.scope)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: telemetry-windows-tests

      - name: Run telemetry tests
        run: go test -short ./internal/telemetry

  test:
    needs: [changes, test-shards, telemetry-linux-tests, telemetry-windows-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected tests
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change detection result: ${{ needs.changes.result }}"
            exit 1
          fi

          case "${{ needs.changes.outputs.scope }}" in
            full)
              results="${{ needs.test-shards.result }} ${{ needs.telemetry-windows-tests.result }}"
              ;;
            telemetry)
              results="${{ needs.telemetry-linux-tests.result }} ${{ needs.telemetry-windows-tests.result }}"
              ;;
            *)
              echo "No general Go tests required for ${{ needs.changes.outputs.scope }} changes"
              exit 0
              ;;
          esac

          if [ "$results" != "success success" ]; then
            echo "selected test results: $results"
            exit 1
          fi

  build-platforms:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            command: |
              export CGO_CFLAGS="-O2 -g -mmacosx-version-min=13.0"
              export CGO_LDFLAGS="-O2 -g -mmacosx-version-min=13.0"
              ASC_BYPASS_KEYCHAIN=1 go test -short ./internal/screenshots
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/rootfs
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/artifacts -run '^TestVerifyMachOChecks(SystemBinary|LaunchConstrainedBinary)IntegrityAndTrust$'
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/secureopen -run 'NoInherit'
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/cli/certificates -run 'ACL|OwnerOnlyAtCreation'
              MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o build/asc_dev_macos_amd64 .
              MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o build/asc_dev_macos_arm64 .
          - name: Linux
            runner: ubuntu-latest
            command: |
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/asc_dev_linux_amd64 .
              CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o build/asc_dev_linux_arm64 .
          - name: Windows
            runner: windows-latest
            command: |
              ASC_BYPASS_KEYCHAIN=1 go test -count=1 ./internal/screenshots
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/secureopen
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/cli/shared -run '^(TestSafeWriteFileNoSymlink|TestPublishStagedFileNoReplace|TestWriteNewFileNoSymlink|TestCleanupIncompleteFile)'
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/cli/certificates -run '^TestCreateCertificateExportStagingFileProtectsDACLAtCreation$'
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/rootfs
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/xcode -run '^TestSigningApplyUnsupportedOnWindowsLeavesProjectUntouched$'
              ASC_BYPASS_KEYCHAIN=1 go test -short -count=1 ./internal/cli/xcode -run '^(TestXcodeHelpScopesMacOSRequirementToXcodeTooling|TestXcodeSigningApplyHelpExplainsWindowsBoundary)$'
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o build/asc_dev_windows_amd64.exe .
              ASC_BYPASS_KEYCHAIN=1 ASC_WINDOWS_CREDENTIAL_SMOKE=1 ASC_WINDOWS_SMOKE_BINARY=../../../build/asc_dev_windows_amd64.exe go test -count=1 ./internal/cli/auth -run '^TestWindowsCredentialManagerNativeRoundTrip$'
          - name: security-key macOS
            runner: macos-latest
            command: |
              brew install libfido2 pkg-config
              pkg-config --atleast-version=1.14.0 libfido2
              export CGO_ENABLED=1 GOMAXPROCS=4 GOFLAGS=-p=4
              go build -tags fido2 -o build/asc_dev_fido2_macos .
              ASC_BYPASS_KEYCHAIN=1 go test -race -tags fido2 -p=1 -parallel=4 -count=1 ./internal/securitykey ./internal/web ./internal/cli/web ./internal/cli/cmdtest -run 'SecurityKey|SecurityChallenge|TwoFactorDelivery|TwoFactorPreference|SignCancelledBeforeDeviceDiscovery'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: build-${{ matrix.name }}

      - name: Create build directory
        run: mkdir -p build
        shell: bash

      - name: Build for ${{ matrix.name }}
        run: ${{ matrix.command }}
        shell: bash

  ordinary-build:
    needs: changes
    if: needs.changes.outputs.scope == 'telemetry'
    name: ordinary build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: ordinary-${{ matrix.name }}

      - name: Compile CLI
        run: go build .

  build:
    needs: [changes, build-platforms, ordinary-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected builds
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change detection result: ${{ needs.changes.result }}"
            exit 1
          fi

          case "${{ needs.changes.outputs.scope }}" in
            full) result="${{ needs.build-platforms.result }}" ;;
            telemetry) result="${{ needs.ordinary-build.result }}" ;;
            *)
              echo "No CLI build required for ${{ needs.changes.outputs.scope }} changes"
              exit 0
              ;;
          esac

          if [ "$result" != "success" ]; then
            echo "selected build result: $result"
            exit 1
          fi
