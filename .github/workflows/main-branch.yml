name: Main Branch (with integration tests)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      wall_only: ${{ steps.scope.outputs.wall_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            files="$(git diff --name-only "$before" "$after")"
          else
            files="$(git diff-tree --no-commit-id --name-only -r "$after")"
          fi

          wall_only=true
          has_files=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            has_files=true
            if [ "$path" != "docs/wall-of-apps.json" ]; then
              wall_only=false
            fi
          done <<< "$files"

          if [ "$has_files" = false ]; then
            wall_only=false
          fi

          echo "wall_only=$wall_only" >> "$GITHUB_OUTPUT"

  wall-only-check:
    needs: changes
    if: needs.changes.outputs.wall_only == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Check Wall of Apps source
        run: make check-wall-of-apps

  format-and-lint:
    needs: changes
    if: needs.changes.outputs.wall_only != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Cache Go tools
        id: go-tools-cache
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}

      - name: Install tooling
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: make tools

      - parallel:
          - name: Check formatting
            run: |
              export PATH="$(go env GOPATH)/bin:$PATH"
              make format-check

          - name: Check Wall of Apps source
            run: make check-wall-of-apps

          - name: Self-test docs validators
            run: python3 scripts/test_check_docs.py

          - name: Check documentation
            run: make check-docs

          - name: Run lint
            run: |
              export PATH="$(go env GOPATH)/bin:$PATH"
              make lint

  test-shards:
    needs: changes
    if: needs.changes.outputs.wall_only != 'true'
    name: test shard (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            command: go test -v ./cmd && python3 scripts/go_test_shard.py packages --packages ./... --exclude ./cmd --exclude ./internal/cli/cmdtest --exclude ./internal/cli/web --shard-index 0 --shard-total 1 -- -v
          - name: web 1/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/web --shard-index 0 --shard-total 2 -- -v
          - name: web 2/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/web --shard-index 1 --shard-total 2 -- -v
          - name: cmdtest 1/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/cmdtest --shard-index 0 --shard-total 2 -- -v
          - name: cmdtest 2/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/cmdtest --shard-index 1 --shard-total 2 -- -v
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run Go test shard
        run: ASC_BYPASS_KEYCHAIN=1 ${{ matrix.command }}

  test:
    needs: [changes, test-shards]
    if: always() && needs.changes.outputs.wall_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify test shards
        run: |
          if [ "${{ needs.test-shards.result }}" != "success" ]; then
            echo "test-shards result: ${{ needs.test-shards.result }}"
            exit 1
          fi

  build:
    needs: changes
    if: needs.changes.outputs.wall_only != 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Create build directory
        run: mkdir -p build

      - parallel:
          - name: Build for macOS
            run: |
              GOOS=darwin GOARCH=amd64 go build -o build/asc_dev_macOS_amd64 .
              GOOS=darwin GOARCH=arm64 go build -o build/asc_dev_macOS_arm64 .

          - name: Build for Linux
            run: |
              GOOS=linux GOARCH=amd64 go build -o build/asc_dev_linux_amd64 .
              GOOS=linux GOARCH=arm64 go build -o build/asc_dev_linux_arm64 .

          - name: Build for Windows
            run: |
              GOOS=windows GOARCH=amd64 go build -o build/asc_dev_windows_amd64.exe .

      - name: Create checksums
        run: |
          cd build
          shasum -a 256 * > asc_dev_checksums.txt
          cat asc_dev_checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: main-builds
          path: build/
