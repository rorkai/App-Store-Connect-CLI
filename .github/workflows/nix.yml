name: Nix flake

# `nix run` catches packages that evaluate and build but fail at exec time.
on:
  # No branch filter: stacked pull requests target other pull request branches.
  pull_request:
    paths:
      - "**.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/nix.yml"
  push:
    branches: [main]
    paths:
      - "**.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix and select the shared cache
        uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
        with:
          github-token: ${{ github.token }}
          cache-scope: ${{ matrix.os }}
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          extra-conf: |
            keep-derivations = true
            keep-outputs = true

      # Formatting and evaluation do not depend on the runner's platform, so
      # only Linux runs them.
      - parallel:
          - name: Check Nix formatting
            if: runner.os == 'Linux'
            run: nix fmt -- --ci

          - name: Evaluate the flake for every system
            if: runner.os == 'Linux'
            run: nix flake check --all-systems --no-build

          - name: Build and run the package
            run: |
              nix build .#default
              nix run .#default -- --version
