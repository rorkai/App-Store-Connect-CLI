name: Nix flake

# `nix run` catches packages that evaluate and build but fail at exec time.
on:
  # No branch filter: stacked pull requests target other pull request branches.
  pull_request:
    paths:
      - "**.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/nix.yml"
  push:
    branches: [main]
    paths:
      - "**.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # access-tokens keeps GitHub tarball fetches off the anonymous rate limit.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}
            max-jobs = auto
            keep-derivations = true
            keep-outputs = true

      # The key covers everything the store holds (toolchain, Nixpkgs, Go
      # modules), so a hit skips re-downloading them. Only main saves, so
      # pull request code never writes a store that later runs restore.
      # Before saving, garbage collection trims a store above 4 GB. The
      # build's result link roots the package, and keep-outputs plus
      # keep-derivations keep its toolchain and Go modules alive with it.
      # A separate main-only job purges older stores without giving builds a
      # token that can delete Actions caches.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'go.mod', 'go.sum') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size: 4G

      # Formatting and evaluation do not depend on the runner's platform, so
      # only Linux runs them.
      - parallel:
          - name: Check Nix formatting
            if: runner.os == 'Linux'
            run: nix fmt -- --ci

          - name: Evaluate the flake for every system
            if: runner.os == 'Linux'
            run: nix flake check --all-systems --no-build

          - name: Build and run the package
            run: |
              nix build .#default
              nix run .#default -- --version

  purge-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: nix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        cache-os: [Linux, macOS]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Purge superseded Nix caches
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: nix-${{ matrix.cache-os }}-
          CURRENT_KEY: nix-${{ matrix.cache-os }}-${{ hashFiles('flake.lock', '**/*.nix', 'go.mod', 'go.sum') }}
        run: |
          # An older build can finish last. Only the current main tip may purge.
          main_tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$main_tip" = "$GITHUB_SHA" ] || exit 0
          caches=$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/caches" \
            -f ref=refs/heads/main -f key="$CACHE_PREFIX" -f per_page=100)
          # If saving failed, retain the fallback. Never delete a newer run's cache.
          ids=$(jq -r --arg key "$CURRENT_KEY" '
            [.[].actions_caches[]] as $all |
            ([$all[] | select(.key == $key)] | max_by(.created_at)) as $current |
            if $current == null then empty else
              $all[] | select(.id != $current.id and .created_at < $current.created_at) | .id
            end' <<< "$caches")
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"
          done <<< "$ids"
