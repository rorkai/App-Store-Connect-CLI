name: Release CLI

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build or repair
        required: true
        type: string
      notarize_existing:
        description: Notarize an existing release without replacing its assets
        required: false
        default: false
        type: boolean

concurrency:
  group: release-cli-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  repair-notarization:
    if: github.event_name == 'workflow_dispatch' && inputs.notarize_existing
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - name: Checkout workflow verification tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          TAG="${RELEASE_TAG}"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match x.y.z. Got: ${TAG}"
            exit 1
          fi

          printf 'VERSION=%s\n' "$TAG" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate notarization secrets
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          missing=0
          for name in APPLE_DEVELOPER_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret ${name} is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare App Store Connect auth
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/AuthKey.p8"
          python3 -c 'import base64, os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "AuthKey.p8").write_bytes(base64.b64decode(os.environ["ASC_PRIVATE_KEY_B64"], validate=True))'
          go build -trimpath -ldflags "-s -w" -o /tmp/asc-notary-bootstrap .

      - name: Verify notarization auth
        env:
          ASC_BYPASS_KEYCHAIN: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: /tmp/asc-notary-bootstrap notarization list --limit 1 --output json >/dev/null

      - name: Download and verify existing release
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p existing-release
          gh release download "${VERSION}" --dir existing-release
          python3 workflow-source/scripts/verify_release_assets.py --release-dir existing-release --version "${VERSION}"
          for binary in existing-release/asc_*_macOS_*; do
            test -f "$binary"
            codesign --verify --deep --strict --verbose=2 "$binary"
            authority=$(codesign -dv --verbose=4 "$binary" 2>&1 | sed -n 's/^Authority=//p' | head -n 1)
            if [ "$authority" != "$APPLE_DEVELOPER_ID" ]; then
              echo "::error::$(basename "$binary") is signed by an unexpected Developer ID"
              exit 1
            fi
          done

      - name: Notarize existing macOS binaries
        env:
          ASC_BYPASS_KEYCHAIN: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          for binary in existing-release/asc_*_macOS_*; do
            archive="${RUNNER_TEMP}/$(basename "$binary").zip"
            output="${RUNNER_TEMP}/$(basename "$binary").notarization.json"
            errors="${RUNNER_TEMP}/$(basename "$binary").notarization.stderr"
            ditto -c -k --keepParent "$binary" "$archive"

            set +e
            /tmp/asc-notary-bootstrap notarization submit \
              --file "$archive" \
              --wait \
              --timeout 1h \
              --output json >"$output" 2>"$errors"
            status=$?
            set -e

            cat "$errors" >&2 || true
            cat "$output"
            submission_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("data", {}).get("id", ""))' "$output" 2>/dev/null || true)
            if [ "$status" -ne 0 ]; then
              if [ -n "$submission_id" ]; then
                /tmp/asc-notary-bootstrap notarization log --id "$submission_id" --output json || true
              fi
              exit "$status"
            fi

            ticket_available=0
            for _ in {1..20}; do
              if codesign -vvvv -R="notarized" --check-notarization "$binary"; then
                ticket_available=1
                break
              fi
              sleep 15
            done
            if [ "$ticket_available" -ne 1 ]; then
              echo "::error::Notarization ticket is not available for $(basename "$binary")"
              exit 1
            fi
          done

      - name: Remove notarization credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  prepare:
    name: Resolve release state
    if: github.event_name != 'workflow_dispatch' || !inputs.notarize_existing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match x.y.z. Got: ${TAG}"
            exit 1
          fi
          printf 'VERSION=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Detect published GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_error="${RUNNER_TEMP}/release-state.stderr"
          if release_is_draft=$(gh api "repos/${GH_REPO}/releases/tags/${VERSION}" --jq '.draft' 2>"$release_error"); then
            if [ "$release_is_draft" = "false" ]; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -Fq "HTTP 404" "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve immutable candidate
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      reused: ${{ steps.candidate_artifact.outputs.reused }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false

      - name: Freeze exact release source
        id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for existing immutable build artifact
        id: candidate_artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          artifact_name="candidate-release-${VERSION}"
          release_commit=$(git rev-parse HEAD)
          artifact_id=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" | \
            jq -sr --arg name "$artifact_name" '[.[].artifacts[] | select(.name == $name and .expired == false)][0].id // empty')
          if [ -n "$artifact_id" ]; then
            artifact_dir="${RUNNER_TEMP}/same-run-candidate-${artifact_id}"
            mkdir -p "$artifact_dir"
            gh api "repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" > "$artifact_dir/artifact.zip"
            python3 -m zipfile -e "$artifact_dir/artifact.zip" "$artifact_dir"
            archive="${artifact_dir}/candidate-release-${VERSION}.tar"
            provenance="${artifact_dir}/candidate-release-${VERSION}.commit"
            if [ ! -f "$archive" ] || [ ! -f "$provenance" ] || ! test "$(cat "$provenance")" = "$release_commit"; then
              echo "::error::Retained candidate artifact does not match release source ${release_commit}" >&2
              exit 1
            fi
            echo "Reusing immutable build artifact ${artifact_name}."
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "cross_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          draft_dir="${RUNNER_TEMP}/existing-release-draft"
          draft_has_assets=0
          release_is_draft=$(gh release view "${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$release_is_draft" = "true" ]; then
            draft_asset_count=$(gh release view "${VERSION}" --json assets --jq '.assets | length')
            if [ "$draft_asset_count" -gt 0 ]; then
              mkdir -p "$draft_dir"
              gh release download "${VERSION}" --dir "$draft_dir"
              draft_has_assets=1
            fi
          fi

          mkdir -p workflow-artifact
          default_branch=$(gh api "repos/${GH_REPO}" --jq '.default_branch')
          while IFS=$'\t' read -r artifact_id artifact_run_id; do
            [ -n "$artifact_id" ] || continue
            run_path=""
            run_head_sha=""
            run_event=""
            run_repository=""
            run_head_branch=""
            IFS=$'\t' read -r run_path run_head_sha run_event run_repository run_head_branch < <(gh api "repos/${GH_REPO}/actions/runs/${artifact_run_id}" \
              --jq '[.path, .head_sha, .event, .head_repository.full_name, .head_branch] | @tsv' 2>/dev/null || true)
            if [ "$run_path" != ".github/workflows/release.yml" ] || [ "$run_repository" != "$GH_REPO" ]; then
              continue
            fi
            case "$run_event" in
              push) [ "$run_head_sha" = "$release_commit" ] || continue ;;
              workflow_dispatch) [ "$run_head_branch" = "$default_branch" ] || continue ;;
              *) continue ;;
            esac
            artifact_dir="${RUNNER_TEMP}/candidate-artifact-${artifact_id}"
            archive_zip="${artifact_dir}/artifact.zip"
            archive_dir="${artifact_dir}/download"
            candidate_dir="${artifact_dir}/candidate"
            mkdir -p "$archive_dir" "$candidate_dir"
            if ! gh api "repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" > "$archive_zip"; then
              continue
            fi
            if ! ditto -x -k "$archive_zip" "$archive_dir"; then
              continue
            fi
            archive="${archive_dir}/candidate-release-${VERSION}.tar"
            provenance="${archive_dir}/candidate-release-${VERSION}.commit"
            if [ ! -f "$archive" ] || [ ! -f "$provenance" ] || ! test "$(cat "$provenance")" = "$release_commit"; then
              continue
            fi

            if [ "$draft_has_assets" -eq 1 ]; then
              if ! tar -xf "$archive" -C "$candidate_dir"; then
                continue
              fi
              candidate_matches=1
              while IFS= read -r -d '' draft_asset; do
                name=$(basename "$draft_asset")
                if [ ! -f "$candidate_dir/release/$name" ] || ! cmp -s "$draft_asset" "$candidate_dir/release/$name"; then
                  candidate_matches=0
                  break
                fi
              done < <(find "$draft_dir" -maxdepth 1 -type f -print0)
              if [ "$candidate_matches" -ne 1 ]; then
                continue
              fi
            fi

            cp "$archive" "workflow-artifact/candidate-release-${VERSION}.tar"
            cp "$provenance" "workflow-artifact/candidate-release-${VERSION}.commit"
            echo "Recovered immutable build artifact ${artifact_name} (${artifact_id})."
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "cross_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          done < <(gh api --paginate -X GET "repos/${GH_REPO}/actions/artifacts" \
            -f name="$artifact_name" \
            -f per_page=100 | \
            jq -sr '[.[].artifacts[]] | sort_by(.created_at) | reverse[] | select(.expired == false) | [.id, .workflow_run.id] | @tsv')

          if [ "$draft_has_assets" -eq 1 ]; then
            echo "::error::No retained candidate artifact matches the existing draft assets"
            exit 1
          fi
          echo "reused=false" >> "$GITHUB_OUTPUT"
          echo "cross_run=false" >> "$GITHUB_OUTPUT"

      - name: Materialize recovered immutable release artifact
        if: steps.candidate_artifact.outputs.cross_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-release-${{ needs.prepare.outputs.version }}
          path: |
            workflow-artifact/candidate-release-${{ needs.prepare.outputs.version }}.tar
            workflow-artifact/candidate-release-${{ needs.prepare.outputs.version }}.commit
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Release quality guardrails
    needs:
      - prepare
      - resolve
    if: needs.prepare.outputs.published != 'true' && needs.resolve.outputs.reused != 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install tooling
        run: make tools

      - name: Self-test docs validators
        run: python3 scripts/test_check_docs.py

      - name: Run release guardrails
        run: |
          PATH_VALUE="$(go env GOPATH)/bin:$PATH"
          export PATH="$PATH_VALUE"
          make format-check
          make check-docs
          make check-wall-of-apps
          make lint

  quality-tests:
    name: Release tests (${{ matrix.name }})
    needs:
      - prepare
      - resolve
    if: needs.prepare.outputs.published != 'true' && needs.resolve.outputs.reused != 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            shard: packages --packages ./... --exclude ./internal/cli/cmdtest --exclude ./internal/cli/web --shard-index 0 --shard-total 1
          - name: web 1/2
            shard: tests --package ./internal/cli/web --shard-index 0 --shard-total 2
          - name: web 2/2
            shard: tests --package ./internal/cli/web --shard-index 1 --shard-total 2
          - name: cmdtest 1/2
            shard: tests --package ./internal/cli/cmdtest --shard-index 0 --shard-total 2
          - name: cmdtest 2/2
            shard: tests --package ./internal/cli/cmdtest --shard-index 1 --shard-total 2
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Go test shard
        env:
          SHARD: ${{ matrix.shard }}
          UNSHARDED_FALLBACK: ${{ matrix.name == 'packages' }}
        run: |
          config_dir="$(mktemp -d "${RUNNER_TEMP}/asc-test-config.XXXXXX")"
          chmod 500 "$config_dir"
          if [ -f scripts/go_test_shard.py ]; then
            read -r -a shard_args <<< "$SHARD"
            ASC_BYPASS_KEYCHAIN=1 ASC_CONFIG_PATH="$config_dir/config.json" python3 scripts/go_test_shard.py "${shard_args[@]}" -- -count=1 -v
          elif [ "$UNSHARDED_FALLBACK" = "true" ]; then
            echo "::notice::Release source predates scripts/go_test_shard.py; running the full Go suite in this shard"
            ASC_BYPASS_KEYCHAIN=1 ASC_CONFIG_PATH="$config_dir/config.json" go test -count=1 -v ./...
          else
            echo "::notice::Release source predates scripts/go_test_shard.py; the packages shard runs the full Go suite"
            exit 0
          fi
          if [ -n "$(ls -A "$config_dir")" ]; then
            echo "::error::Tests wrote to the shared test config directory; set ASC_CONFIG_PATH in the test instead"
            exit 1
          fi

  macos:
    name: Build, sign, and notarize macOS
    needs:
      - prepare
      - resolve
    if: needs.prepare.outputs.published != 'true' && needs.resolve.outputs.reused != 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Validate release secrets
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          missing=0
          for name in APPLE_DEVELOPER_ID_CERT APPLE_DEVELOPER_ID_PASSWORD APPLE_DEVELOPER_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret ${name} is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Create release directory
        run: mkdir -p release

      - name: Build macOS binaries
        env:
          CGO_CFLAGS: "-O2 -g -mmacosx-version-min=13.0"
          CGO_LDFLAGS: "-O2 -g -mmacosx-version-min=13.0"
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(git show -s --format=%cI HEAD)
          MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "release/asc_${VERSION}_macOS_amd64" .
          MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "release/asc_${VERSION}_macOS_arm64" .

      - name: Select native release binary for notarization
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=amd64 ;;
            *) echo "::error::Unsupported macOS runner architecture"; exit 1 ;;
          esac
          printf 'NOTARY_CLI=%s/release/asc_%s_macOS_%s\n' "$GITHUB_WORKSPACE" "$VERSION" "$arch" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect auth
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/AuthKey.p8"
          python3 -c 'import base64, os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "AuthKey.p8").write_bytes(base64.b64decode(os.environ["ASC_PRIVATE_KEY_B64"], validate=True))'

      - name: Verify notarization auth
        env:
          ASC_BYPASS_KEYCHAIN: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          "$NOTARY_CLI" notarization list --limit 1 --output json >/dev/null

      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

      - name: Sign and verify macOS binaries
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          # Pin the code signing identifier. Without it codesign derives one
          # from the versioned file name, so every release carries a different
          # designated requirement. macOS keychain ACLs trust applications by
          # that requirement, which re-prompts for stored credentials after
          # every upgrade even after "Always Allow".
          ASC_CODESIGN_IDENTIFIER: com.rorkai.asc
        run: |
          for binary in release/asc_*_macOS_*; do
            codesign --force --sign "${APPLE_DEVELOPER_ID}" --identifier "${ASC_CODESIGN_IDENTIFIER}" --timestamp --options=runtime "$binary"
            codesign --verify --deep --strict --verbose=2 "$binary"
            identifier=$(codesign -dv --verbose=4 "$binary" 2>&1 | sed -n 's/^Identifier=//p' | head -n 1)
            if [ "$identifier" != "$ASC_CODESIGN_IDENTIFIER" ]; then
              echo "::error::$(basename "$binary") has an unexpected code signing identifier: ${identifier}"
              exit 1
            fi
          done

      - name: Notarize macOS binaries
        env:
          ASC_BYPASS_KEYCHAIN: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          for binary in release/asc_*_macOS_*; do
            archive="${RUNNER_TEMP}/$(basename "$binary").zip"
            output="${RUNNER_TEMP}/$(basename "$binary").notarization.json"
            errors="${RUNNER_TEMP}/$(basename "$binary").notarization.stderr"
            ditto -c -k --keepParent "$binary" "$archive"

            set +e
            "$NOTARY_CLI" notarization submit \
              --file "$archive" \
              --wait \
              --timeout 1h \
              --output json >"$output" 2>"$errors"
            status=$?
            set -e

            cat "$errors" >&2 || true
            cat "$output"
            submission_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("data", {}).get("id", ""))' "$output" 2>/dev/null || true)
            if [ "$status" -ne 0 ]; then
              if [ -n "$submission_id" ]; then
                "$NOTARY_CLI" notarization log --id "$submission_id" --output json || true
              fi
              exit "$status"
            fi

            ticket_available=0
            for _ in {1..20}; do
              if codesign -vvvv -R="notarized" --check-notarization "$binary"; then
                ticket_available=1
                break
              fi
              sleep 15
            done
            if [ "$ticket_available" -ne 1 ]; then
              echo "::error::Notarization ticket is not available for $(basename "$binary")"
              exit 1
            fi
          done

      - name: Remove notarization credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Pack macos intermediate
        run: |
          git rev-parse HEAD > commit
          mkdir -p workflow-artifact
          COPYFILE_DISABLE=1 tar -cf workflow-artifact/macos.tar release commit

      - name: Upload macos intermediate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intermediate-macos-${{ github.run_attempt }}
          path: workflow-artifact/macos.tar
          if-no-files-found: error
          retention-days: 14

  portable:
    name: Build Linux and Windows
    needs:
      - prepare
      - resolve
    if: needs.prepare.outputs.published != 'true' && needs.resolve.outputs.reused != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Create release directory
        run: mkdir -p release

      - name: Build for Linux
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(git show -s --format=%cI HEAD)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "release/asc_${VERSION}_linux_amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "release/asc_${VERSION}_linux_arm64" .

      - name: Build for Windows
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(git show -s --format=%cI HEAD)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "release/asc_${VERSION}_windows_amd64.exe" .

      - name: Pack portable intermediate
        run: |
          git rev-parse HEAD > commit
          mkdir -p workflow-artifact
          tar -cf workflow-artifact/portable.tar release commit

      - name: Upload portable intermediate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intermediate-portable-${{ github.run_attempt }}
          path: workflow-artifact/portable.tar
          if-no-files-found: error
          retention-days: 14

  build:
    name: Qualify immutable release candidate
    needs:
      - prepare
      - resolve
      - quality
      - quality-tests
      - macos
      - portable
    if: >-
      always() && needs.prepare.result == 'success' && needs.resolve.result == 'success' && (needs.resolve.outputs.reused == 'true' || (needs.quality.result == 'success' && needs.quality-tests.result == 'success' && needs.macos.result == 'success' && needs.portable.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout workflow release tools
        if: needs.resolve.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false

      - name: Resolve retained intermediates from this run
        if: needs.resolve.outputs.reused != 'true'
        id: intermediates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/intermediates.json"
          for lane in macos portable; do
            artifact_id=$(jq -sr --arg lane "$lane" '[.[].artifacts[] | select(.expired == false) | select(.name | test("^intermediate-" + $lane + "-[0-9]+$"))] | sort_by(.created_at, .id) | last | .id // empty' "$RUNNER_TEMP/intermediates.json")
            if [ -z "$artifact_id" ]; then
              echo "::error::Missing retained ${lane} intermediate for this workflow run"
              exit 1
            fi
            printf '%s=%s\n' "$lane" "$artifact_id" >> "$GITHUB_OUTPUT"
          done

      - name: Download macOS intermediate
        if: needs.resolve.outputs.reused != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.intermediates.outputs.macos }}
          path: intermediate-macos

      - name: Download portable intermediate
        if: needs.resolve.outputs.reused != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.intermediates.outputs.portable }}
          path: intermediate-portable

      - name: Create checksums and verify exact-source intermediates
        if: needs.resolve.outputs.reused != 'true'
        run: |
          python3 workflow-source/scripts/test_assemble_release_candidate.py
          python3 workflow-source/scripts/assemble_release_candidate.py \
            --macos intermediate-macos/macos.tar \
            --portable intermediate-portable/portable.tar \
            --output candidate \
            --version "$VERSION" \
            --expected-sha "$RELEASE_SHA"
          mv candidate/release release
          python3 workflow-source/scripts/verify_release_assets.py --release-dir release --version "$VERSION"

      - name: Pack immutable release artifact
        if: needs.resolve.outputs.reused != 'true'
        run: |
          mkdir -p workflow-artifact
          tar -cf "workflow-artifact/candidate-release-${VERSION}.tar" release
          cp candidate/commit "workflow-artifact/candidate-release-${VERSION}.commit"

      - name: Upload immutable release artifact
        if: needs.resolve.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-release-${{ needs.prepare.outputs.version }}
          path: |
            workflow-artifact/candidate-release-${{ needs.prepare.outputs.version }}.tar
            workflow-artifact/candidate-release-${{ needs.prepare.outputs.version }}.commit
          if-no-files-found: error
          retention-days: 14


  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.published == 'true' || needs.build.result == 'success')
    runs-on: macos-latest
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout workflow release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false

      - name: Check for existing published artifact
        id: published_artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          artifact_name="published-release-${VERSION}"
          artifact_id=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" | \
            jq -sr --arg name "$artifact_name" '[.[].artifacts[] | select(.name == $name and .expired == false)][0].id // empty')
          if [ -n "$artifact_id" ]; then
            echo "Reusing immutable published artifact ${artifact_name}."
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download immutable release artifact
        if: steps.published_artifact.outputs.reused != 'true' && needs.prepare.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-release-${{ needs.prepare.outputs.version }}
          path: workflow-artifact

      - name: Unpack and verify release artifact
        if: steps.published_artifact.outputs.reused != 'true' && needs.prepare.outputs.published != 'true'
        run: |
          tar -xf "workflow-artifact/candidate-release-${VERSION}.tar"
          python3 workflow-source/scripts/verify_release_assets.py --release-dir release --version "${VERSION}"

      - name: Recover and verify existing published release
        if: steps.published_artifact.outputs.reused != 'true' && needs.prepare.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p published-release
          gh release download "${VERSION}" --repo "${GH_REPO}" --dir published-release
          python3 workflow-source/scripts/verify_release_assets.py --release-dir published-release --version "${VERSION}"

      - name: Create, resume, or verify GitHub Release
        if: steps.published_artifact.outputs.reused != 'true' && needs.prepare.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          expected_names="${RUNNER_TEMP}/expected-release-assets.txt"
          published_names="${RUNNER_TEMP}/published-release-assets.txt"
          checksum_name="asc_${VERSION}_checksums.txt"
          find release -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$expected_names"
          mkdir -p published-release

          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" --draft --generate-notes --verify-tag
          fi

          release_is_draft=$(gh release view "${VERSION}" --json isDraft --jq '.isDraft')
          gh release view "${VERSION}" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$published_names"

          if [ "$release_is_draft" = "true" ]; then
            unexpected_names=$(comm -13 "$expected_names" "$published_names" || true)
            if [ -n "$unexpected_names" ]; then
              echo "::error::Draft release contains unexpected assets"
              echo "$unexpected_names"
              exit 1
            fi

            if grep -Fxq "$checksum_name" "$published_names"; then
              if ! cmp -s "$expected_names" "$published_names"; then
                echo "::error::Draft release has a checksum but is missing required assets"
                diff -u "$expected_names" "$published_names" || true
                exit 1
              fi
              gh release download "${VERSION}" --dir published-release
            else
              for asset in release/asc_*; do
                name=$(basename "$asset")
                if [ "$name" = "$checksum_name" ]; then
                  continue
                fi
                if grep -Fxq "$name" "$published_names"; then
                  gh release download "${VERSION}" --pattern "$name" --dir published-release
                  if ! cmp -s "$asset" "published-release/$name"; then
                    echo "::error::Draft asset ${name} differs from the immutable build artifact"
                    exit 1
                  fi
                else
                  gh release upload "${VERSION}" "$asset"
                  cp "$asset" published-release/
                fi
              done

              (
                cd published-release
                binaries=(asc_*)
                shasum -a 256 "${binaries[@]}" > "$checksum_name"
              )
              gh release upload "${VERSION}" "published-release/${checksum_name}"
            fi

            gh release view "${VERSION}" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$published_names"
            if ! cmp -s "$expected_names" "$published_names"; then
              echo "::error::Draft release does not contain the exact expected assets"
              diff -u "$expected_names" "$published_names" || true
              exit 1
            fi
          else
            if ! cmp -s "$expected_names" "$published_names"; then
              echo "::error::Published release has an unexpected asset set"
              diff -u "$expected_names" "$published_names" || true
              exit 1
            fi
            gh release download "${VERSION}" --dir published-release
          fi

          python3 workflow-source/scripts/verify_release_assets.py --release-dir published-release --version "${VERSION}"
          if [ "$release_is_draft" = "true" ]; then
            gh release edit "${VERSION}" --draft=false
          fi

      - name: Pack immutable published artifact
        if: steps.published_artifact.outputs.reused != 'true'
        run: |
          mkdir -p workflow-artifact
          rm -rf release
          mv published-release release
          tar -cf "workflow-artifact/published-release-${VERSION}.tar" release

      - name: Upload immutable published artifact
        if: steps.published_artifact.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-release-${{ needs.prepare.outputs.version }}
          path: workflow-artifact/published-release-${{ needs.prepare.outputs.version }}.tar
          if-no-files-found: error
          retention-days: 14

  homebrew:
    name: Update Homebrew tap
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Checkout workflow release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false

      - name: Download immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-release-${{ needs.publish.outputs.version }}
          path: workflow-artifact

      - name: Unpack and verify release artifact
        run: |
          tar -xf "workflow-artifact/published-release-${VERSION}.tar"
          python3 workflow-source/scripts/verify_release_assets.py --release-dir release --version "${VERSION}"

      - name: Update Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN not set"
            exit 1
          fi

          SHA256_AMD64=$(shasum -a 256 "release/asc_${VERSION}_macOS_amd64" | cut -d ' ' -f 1)
          SHA256=$(shasum -a 256 "release/asc_${VERSION}_macOS_arm64" | cut -d ' ' -f 1)
          export SHA256_AMD64 SHA256

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/rorkai/homebrew-tap.git" homebrew-tap
          cd homebrew-tap

          python3 - <<'PY'
          import os
          from pathlib import Path
          from textwrap import dedent

          version = os.environ["VERSION"]
          sha256_arm64 = os.environ["SHA256"]
          sha256_amd64 = os.environ["SHA256_AMD64"]
          formula = dedent(
              f"""\
              # typed: false
              # frozen_string_literal: true

              class Asc < Formula
                desc "A fast, AI-agent friendly CLI for App Store Connect"
                homepage 'https://github.com/rorkai/App-Store-Connect-CLI'
                version '{version}'
                license 'MIT'

                depends_on macos: :ventura

                on_macos do
                  if Hardware::CPU.arm?
                    url 'https://github.com/rorkai/App-Store-Connect-CLI/releases/download/{version}/asc_{version}_macOS_arm64'
                    sha256 '{sha256_arm64}'
                  else
                    url 'https://github.com/rorkai/App-Store-Connect-CLI/releases/download/{version}/asc_{version}_macOS_amd64'
                    sha256 '{sha256_amd64}'
                  end
                end

                def install
                  if Hardware::CPU.arm?
                    bin.install 'asc_{version}_macOS_arm64' => 'asc'
                  else
                    bin.install 'asc_{version}_macOS_amd64' => 'asc'
                  end
                end

                test do
                  assert_match version.to_s, shell_output("#{{bin}}/asc --version")
                end
              end
              """
          )
          Path("Formula/asc.rb").write_text(formula, encoding="utf-8")
          PY

          git config user.name "Rudrank Riyam"
          git config user.email "rudrankriyam@gmail.com"
          git add Formula/asc.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already current."
          else
            git commit -m "Update asc to ${VERSION}"
            git push
          fi

  winget:
    name: Submit WinGet package
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.publish.outputs.version }}
          persist-credentials: false

      - name: Checkout workflow verification tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false

      - name: Download immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-release-${{ needs.publish.outputs.version }}
          path: workflow-artifact

      - name: Unpack and verify release artifact
        run: |
          tar -xf "workflow-artifact/published-release-${VERSION}.tar"
          python3 workflow-source/scripts/verify_release_assets.py --release-dir release --version "${VERSION}"

      - name: Generate WinGet manifests
        run: |
          python3 scripts/generate_winget_manifests.py \
            --version "${VERSION}" \
            --release-dir release \
            --output-dir winget-output

      - name: Upload WinGet manifests artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests-${{ needs.publish.outputs.version }}-${{ github.run_attempt }}
          path: winget-output/manifests/r/Rorkai/ASC/${{ needs.publish.outputs.version }}
          if-no-files-found: error

      - name: Submit WinGet package PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          WINGET_FORK_OWNER: ${{ vars.WINGET_FORK_OWNER }}
          WINGET_RETRY_ATTEMPTS: "5"
          WINGET_RETRY_BASE_DELAY: "10"
          WINGET_RETRY_MAX_DELAY: "120"
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WINGET_GITHUB_TOKEN not set; create a token that can fork/push to winget-pkgs and open PRs"
            exit 1
          fi

          # Only GitHub throttling and transient transport failures are worth a
          # retry. Auth, permission, validation, and not-found errors fail fast.
          # Go's net package prefixes every socket-level failure (DNS, routing,
          # connect, read, write) with `dial|read|write tcp`, and libcurl reports
          # its transport-class failures with a numeric code, so match those
          # families instead of enumerating individual messages.
          is_transient_failure() {
            grep -qiE \
              -e 'rate[ -]?limit' \
              -e 'abuse detection' \
              -e 'HTTP (408|429|5[0-9][0-9])' \
              -e 'returned error: (408|429|5[0-9][0-9])' \
              -e 'Too Many Requests|Service Unavailable|Bad Gateway|Gateway Timeout|temporarily unavailable' \
              -e '(dial|read|write) tcp|Temporary failure in name resolution' \
              -e 'curl (5|6|7|16|18|28|35|52|55|56) ' \
              -e 'Could not resolve (host|proxy)|Failed to connect|Connection (refused|reset|timed out)|broken pipe' \
              -e 'Operation timed out|i/o timeout|TLS handshake timeout' \
              -e 'SSL_(read|write|connect)|SSL_ERROR_(SYSCALL|ZERO_RETURN)|gnutls_handshake|Recv failure|Empty reply from server' \
              -e 'Failure when receiving data|transfer closed with outstanding read data' \
              -e '(^|[^[:alnum:]_])EOF([^[:alnum:]_]|$)|remote end hung up unexpectedly|RPC failed|unexpected disconnect' \
              "$1"
          }

          # retry_transient <command...>: run a gh or git network call with bounded
          # exponential backoff and jitter. Stdout is forwarded only from the
          # attempt that succeeds (or the final failure) so callers can capture it.
          retry_transient() {
            local attempt=1 rc delay pause label stdout_file stderr_file
            label="$1${2:+ $2}${3:+ $3}"
            stdout_file=$(mktemp)
            stderr_file=$(mktemp)
            while :; do
              rc=0
              "$@" >"$stdout_file" 2>"$stderr_file" || rc=$?
              cat "$stderr_file" >&2
              if [ "$rc" -eq 0 ]; then
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return 0
              fi
              if ! is_transient_failure "$stderr_file"; then
                echo "retry_transient: '${label}' failed (exit ${rc}) with a non-transient error; not retrying" >&2
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return "$rc"
              fi
              if [ "$attempt" -ge "${WINGET_RETRY_ATTEMPTS:-5}" ]; then
                # The caller decides whether this is fatal, so annotate as a warning.
                echo "::warning::'${label}' still failing after ${attempt} attempts (exit ${rc}); giving up" >&2
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return "$rc"
              fi
              delay=$(( ${WINGET_RETRY_BASE_DELAY:-10} * (1 << (attempt - 1)) ))
              if [ "$delay" -gt "${WINGET_RETRY_MAX_DELAY:-120}" ]; then
                delay=${WINGET_RETRY_MAX_DELAY:-120}
              fi
              pause=$(( delay + RANDOM % (delay / 2 + 1) ))
              echo "::warning::'${label}' hit a GitHub rate limit or transient failure (exit ${rc}); attempt ${attempt}/${WINGET_RETRY_ATTEMPTS:-5}, retrying in ${pause}s" >&2
              sleep "$pause"
              attempt=$((attempt + 1))
            done
          }

          # Reading rate_limit does not count against quota; log it so a throttled
          # run is diagnosable from the job log instead of an opaque gh failure.
          log_rate_limit() {
            local snapshot
            if ! snapshot=$(gh api rate_limit --jq '.resources | to_entries[] | select(.key == "core" or .key == "graphql" or .key == "search") | "\(.key): \(.value.remaining)/\(.value.limit) remaining, resets at \(.value.reset | todate)"' 2>&1); then
              echo "::warning::Could not read the GitHub API rate limit for the WinGet token: ${snapshot}"
              return 0
            fi
            echo "GitHub API rate limit for the WinGet token:"
            echo "${snapshot}"
            if printf '%s\n' "${snapshot}" | grep -qE ': 0/'; then
              echo "::warning::The WinGet token has exhausted a GitHub API rate limit; submission calls will back off and retry, and the job can be re-run after the reset time above"
            fi
          }
          log_rate_limit

          AUTH_LOGIN=$(retry_transient gh api user --jq .login)
          if [ -z "$WINGET_FORK_OWNER" ]; then
            WINGET_FORK_OWNER="${AUTH_LOGIN}"
          fi

          BRANCH="rorkai-asc-${VERSION}"
          MANIFEST_SOURCE="${PWD}/winget-output/manifests/r/Rorkai/ASC/${VERSION}"

          if ! retry_transient gh repo view "${WINGET_FORK_OWNER}/winget-pkgs" >/dev/null; then
            # Forking is idempotent on GitHub's side: an existing fork is returned as is.
            if [ "${WINGET_FORK_OWNER}" = "${AUTH_LOGIN}" ]; then
              retry_transient gh repo fork microsoft/winget-pkgs --clone=false
            else
              retry_transient gh repo fork microsoft/winget-pkgs --org "${WINGET_FORK_OWNER}" --clone=false
            fi
          fi

          # A clone interrupted by a throttle leaves a partial directory behind, so
          # every attempt starts from scratch. Keep the token out of retry log lines.
          clone_winget_fork() {
            rm -rf winget-pkgs &&
              git clone --filter=blob:none --sparse "https://x-access-token:${GH_TOKEN}@github.com/${WINGET_FORK_OWNER}/winget-pkgs.git" winget-pkgs
          }
          retry_transient clone_winget_fork
          cd winget-pkgs
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          retry_transient git fetch origin master
          retry_transient git fetch upstream master
          if ! git merge-base --is-ancestor origin/master upstream/master; then
            echo "::error::The WinGet fork master branch is not an ancestor of upstream/master"
            exit 1
          fi

          retry_transient git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          BRANCH_EXISTS=0
          # The blob:none clone fetches missing objects lazily, so checkout and
          # sparse-checkout are network calls too. -B keeps a retried checkout
          # idempotent when the first attempt created the branch before failing.
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            BRANCH_EXISTS=1
            retry_transient git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            # Avoid requiring workflow scope when the upstream repository has newer workflow files.
            retry_transient git checkout -B "${BRANCH}" origin/master
          fi
          retry_transient git sparse-checkout set "manifests/r/Rorkai/ASC"

          verify_winget_scope() {
            unexpected_paths=()
            while IFS= read -r -d '' changed_path; do
              case "$changed_path" in
                "manifests/r/Rorkai/ASC/${VERSION}/"*) ;;
                *) unexpected_paths+=("$changed_path") ;;
              esac
            done < <(git diff --name-only -z upstream/master...HEAD)
            if [ "${#unexpected_paths[@]}" -ne 0 ]; then
              echo "::error::WinGet branch contains changes outside the ${VERSION} manifest directory"
              printf '%s\n' "${unexpected_paths[@]}"
              exit 1
            fi
          }
          verify_winget_scope

          PR_KIND="New package"
          if [ -d manifests/r/Rorkai/ASC ] && find manifests/r/Rorkai/ASC -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            PR_KIND="New version"
          fi
          # Best-effort count: an exhausted lookup must still yield a number.
          OPEN_PACKAGE_PRS=$(retry_transient gh pr list --repo microsoft/winget-pkgs --state open --search "Rorkai.ASC in:title" --json headRefName --jq "[.[] | select(.headRefName != \"${BRANCH}\")] | length") || OPEN_PACKAGE_PRS=""
          case "${OPEN_PACKAGE_PRS}" in
            ''|*[!0-9]*) OPEN_PACKAGE_PRS="0" ;;
          esac
          if [ "${PR_KIND}" = "New package" ] && [ "${OPEN_PACKAGE_PRS}" != "0" ]; then
            PR_KIND="New version"
          fi

          mkdir -p "manifests/r/Rorkai/ASC/${VERSION}"
          cp "${MANIFEST_SOURCE}"/* "manifests/r/Rorkai/ASC/${VERSION}/"

          git config user.name "Rorkai Release Bot"
          git config user.email "release-bot@rork.com"
          git add "manifests/r/Rorkai/ASC/${VERSION}"
          if git diff --cached --quiet; then
            if [ "${BRANCH_EXISTS}" = "0" ]; then
              echo "WinGet manifests for ${VERSION} are already published or up to date."
              exit 0
            fi
            echo "WinGet manifests for ${VERSION} already exist on ${BRANCH}; checking for an open PR."
          else
            git commit -m "${PR_KIND}: Rorkai.ASC version ${VERSION}"
            verify_winget_scope
            # Re-pushing an already-pushed branch is a no-op, so a retry after a
            # lost response cannot rewrite history.
            if [ "${BRANCH_EXISTS}" = "1" ]; then
              retry_transient git push origin "${BRANCH}"
            else
              retry_transient git push --set-upstream origin "${BRANCH}"
            fi
          fi

          # The existence checks run inside the retried unit so a create attempt
          # whose response was lost is detected on the next attempt instead of
          # opening a duplicate microsoft/winget-pkgs PR.
          submit_winget_pr() {
            local existing_pr
            existing_pr=$(gh pr list --repo microsoft/winget-pkgs --state open --search "Rorkai.ASC version ${VERSION} in:title" --json number --jq '.[0].number // empty') || return $?
            if [ -n "${existing_pr}" ]; then
              echo "WinGet PR already exists for Rorkai.ASC ${VERSION}."
              return 0
            fi
            # gh pr list --head only accepts a bare branch name, so the cross-fork
            # lookup goes through the REST head filter (owner:branch).
            existing_pr=$(gh api "repos/microsoft/winget-pkgs/pulls?state=open&head=${WINGET_FORK_OWNER}:${BRANCH}" --jq '.[0].number // empty') || return $?
            if [ -n "${existing_pr}" ]; then
              echo "WinGet PR already exists for ${VERSION}."
              return 0
            fi
            gh pr create \
              --repo microsoft/winget-pkgs \
              --base master \
              --head "${WINGET_FORK_OWNER}:${BRANCH}" \
              --title "${PR_KIND}: Rorkai.ASC version ${VERSION}" \
              --body "Adds Rorkai.ASC ${VERSION} from https://github.com/rorkai/App-Store-Connect-CLI/releases/tag/${VERSION}."
          }
          retry_transient submit_winget_pr
