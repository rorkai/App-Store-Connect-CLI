name: CodeQL

on:
  pull_request:
    branches: [main]
    # Mirror scripts/ci_change_scope.py: skip Wall-, docs-, and website-only PRs.
    paths:
      - "**"
      - "!docs/**"
      - "docs/openapi/latest.json"
      - "docs/API_NOTES.md"
      - "docs/WORKFLOWS.md"
      - "!*.md"
      - "!website/**"
      - "**.go"
  push:
    branches: [main]
  schedule:
    # Run weekly so long-lived code paths are rescanned even without new PRs.
    - cron: "31 4 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Go code
            language: go
          - name: GitHub Actions
            language: actions
          - name: Python scripts
            language: python
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL for Go
        if: ${{ matrix.language == 'go' }}
        uses: github/codeql-action/init@3ea37a44b6e4e6847c46edae209410d258d548d1 # v4
        with:
          languages: go
          build-mode: manual

      - name: Initialize CodeQL for non-Go languages
        if: ${{ matrix.language != 'go' }}
        uses: github/codeql-action/init@3ea37a44b6e4e6847c46edae209410d258d548d1 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Build Go packages
        if: ${{ matrix.language == 'go' }}
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          category: "/language:${{ matrix.language }}"
